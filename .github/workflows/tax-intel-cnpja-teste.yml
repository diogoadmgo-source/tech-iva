name: Inteligência Tributária · Teste CNPJá (IBS/CBS)

# Teste do provedor CNPJá (plano grátis) para a opção do Simples pelo regime
# regular de IBS/CBS. Poucas consultas, sem gravar nada; o log só mostra a
# estrutura da resposta e totais, nunca CNPJ (repositório público).
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-r25ha6]
    paths: [scripts/tax-intel/cnpja/teste.mjs]

permissions:
  contents: read

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: tax-intel-producao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependências
        working-directory: scripts/tax-intel/cnpja
        run: |
          echo '{"private":true,"type":"module"}' > package.json
          npm install --no-save --no-package-lock --no-audit --no-fund pg@8.16.3
      - name: Consultas de teste
        env:
          CNPJA_API_KEY: ${{ secrets.CNPJA_API_KEY }}
          TAX_INGESTOR_DATABASE_URL: ${{ secrets.TAX_INGESTOR_DATABASE_URL }}
        run: node scripts/tax-intel/cnpja/teste.mjs
