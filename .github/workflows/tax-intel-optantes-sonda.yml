name: Inteligência Tributária · Sonda Consulta Optantes

# UMA consulta na Consulta Optantes da Receita, com CNPJ público de órgão
# (nunca da carteira). Serve para saber se a Receita aceita acesso a partir do
# GitHub Actions e como a página responde. Sem banco e sem segredo.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-r25ha6]
    paths:
      - scripts/tax-intel/optantes/sonda.mjs
      - .github/workflows/tax-intel-optantes-sonda.yml

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Playwright
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Uma consulta
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" cp scripts/tax-intel/optantes/sonda.mjs "$RUNNER_TEMP/pw/" && cd "$RUNNER_TEMP/pw" && node sonda.mjs "$GITHUB_WORKSPACE/sonda-optantes"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonda-optantes
          path: sonda-optantes
          retention-days: 7
