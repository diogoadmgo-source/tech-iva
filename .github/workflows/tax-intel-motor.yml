name: Inteligência Tributária · Motor em massa

# Execução MANUAL do motor (scripts/tax-intel/executor/run.mjs).
#   sonda: sem banco e sem segredo. Baixa os arquivos públicos da Receita,
#          confere o layout e mede volume e tempo. Só cruza a amostra pública.
#   carga: grava no Supabase com o papel tax_ingestor (nunca service_role).
#          Exige o ambiente "tax-intel-producao", com aprovação manual, e o
#          segredo TAX_INGESTOR_DATABASE_URL nesse ambiente.
# Nada roda sozinho: não há gatilho de push nem de agenda.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "sonda (sem banco) ou carga (grava no Supabase)"
        type: choice
        options: [sonda, carga]
        default: sonda
      competencia:
        description: "AAAA-MM (vazio = a mais recente publicada)"
        type: string
        required: false
      datasets:
        description: "Fontes, separadas por vírgula"
        type: string
        default: "receita_simples,receita_empresas,receita_estabelecimentos,receita_regime_tributario"

permissions:
  contents: read

concurrency:
  group: tax-intel-motor
  cancel-in-progress: false

jobs:
  sonda:
    if: inputs.modo == 'sonda'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Diagnóstico do endereço da Receita
        continue-on-error: true
        # A raiz de arquivos.receitafederal.gov.br redireciona para um
        # compartilhamento público do Nextcloud (index.php/s/<token>). Lista as
        # pastas pelo WebDAV público para achar CNPJ e regime tributário.
        run: |
          raiz=$(curl -sS -L -o /dev/null -w '%{url_effective}' --max-time 60 https://arquivos.receitafederal.gov.br/)
          echo "raiz: $raiz"
          token=${raiz##*/s/}; token=${token%%[/?]*}
          echo "token: $token"
          listar() {
            echo "=== PROPFIND $1"
            curl -sS -X PROPFIND -H 'Depth: 1' -u "$token:" --max-time 60 \
              -w '\nHTTP %{http_code}\n' "https://arquivos.receitafederal.gov.br/public.php/webdav$1" \
              | tee resp.xml | grep -oE '<d:href>[^<]+</d:href>|<d:getcontentlength>[0-9]+|<d:getlastmodified>[^<]+|^HTTP [0-9]+' | sed 's/<[^>]*>//g' | head -80
          }
          listar /
          head -c 600 resp.xml; echo
          echo "=== PROPFIND dav/files (Nextcloud 29+)"
          curl -sS -X PROPFIND -H 'Depth: 1' --max-time 60 -w '\nHTTP %{http_code}\n' \
            "https://arquivos.receitafederal.gov.br/public.php/dav/files/$token/" \
            | grep -oE '<d:href>[^<]+</d:href>|^HTTP [0-9]+' | sed 's/<[^>]*>//g' | head -40
          for d in $(grep -oE '<d:href>[^<]+/</d:href>' resp.xml | sed 's/<[^>]*>//g;s#.*/public.php/webdav##' | grep -v '^/$' | head -15); do
            listar "$d"
            for e in $(grep -oE '<d:href>[^<]+/</d:href>' resp.xml | sed 's/<[^>]*>//g;s#.*/public.php/webdav##' | grep -v "^$d$" | grep -iE 'cnpj|regime|tribut|cadastr|dados' | head -6); do
              listar "$e"
            done
          done
      - name: Sonda dos arquivos públicos
        run: >
          node scripts/tax-intel/executor/run.mjs --sonda
          --datasets "${{ inputs.datasets }}"
          ${{ inputs.competencia && format('--competencia {0}', inputs.competencia) || '' }}
          --tmp "$RUNNER_TEMP/receita" --relatorio relatorio-sonda.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-sonda
          path: relatorio-sonda.json

  carga:
    if: inputs.modo == 'carga'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: tax-intel-producao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependências
        run: npm install --no-save --no-package-lock pg@8.16.3
      - name: Carga das carteiras
        env:
          TAX_INGESTOR_DATABASE_URL: ${{ secrets.TAX_INGESTOR_DATABASE_URL }}
        run: >
          node scripts/tax-intel/executor/run.mjs
          --datasets "${{ inputs.datasets }}"
          ${{ inputs.competencia && format('--competencia {0}', inputs.competencia) || '' }}
          --tmp "$RUNNER_TEMP/receita"
      # Sem artefato na carga: o repositório é público. O log só tem contagens e
      # nomes de arquivo (nenhum CNPJ da carteira); o resumo completo fica no banco
      # (tax_ingest_runs e tax_ingest_summary).
